
<!DOCTYPE html>
<html>
<head>
    <title>Trendy Mart - Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4">

        <div class="flex justify-between items-center">

            <!-- Logo -->
            <h1 class="text-2xl font-bold">Trendy Mart</h1>

            <!-- Navigation -->
            <nav class="flex gap-6">

                <a href="#" class="hover:text-amber-300">Home</a>

                <a href="#" class="hover:text-amber-300">About</a>

                <!-- Dropdown -->
                <div class="relative group">

                    <button class="hover:text-amber-300">
                        Products 
                    </button>

                    <div class="hidden group-hover:block absolute bg-white text-black p-2 w-32">

                        <a href="#" class="block p-2 hover:bg-emerald-100">
                            Laptop
                        </a>

                        <a href="#" class="block p-2 hover:bg-emerald-100">
                            Mobile
                        </a>

                        <a href="#" class="block p-2 hover:bg-emerald-100">
                            Shoes
                        </a>

                    </div>
                </div>

                <a href="#" class="hover:text-amber-300">Contact</a>

            </nav>

        </div>

    </header>

</body>
</html>
